name: efren-bot

x-backend: &backend
  image: efren-bot-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment: &backend-environment
    APP_ENV: ${APP_ENV:-local}
    APP_TIMEZONE: ${APP_TIMEZONE:-America/Merida}
    DEMO_OWNER_ID: ${DEMO_OWNER_ID:-efren}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-efren_bot}:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/${POSTGRES_DB:-efren_bot}

services:
  test-db:
    profiles: [test]
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: efren_bot_test
      POSTGRES_USER: efren_bot
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efren_bot -d efren_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-efren_bot}
      POSTGRES_USER: ${POSTGRES_USER:-efren_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "efren_bot.worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  work-worker:
    <<: *backend
    command: ["python", "-m", "efren_bot.work_worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    init: true
    environment:
      VITE_PROXY_TARGET: http://api:8000
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Merida}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-test-data:
